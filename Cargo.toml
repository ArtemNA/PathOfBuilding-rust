[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
indexmap = "2"
pob-golden = { path = "crates/pob-golden" }
pob-data = { path = "crates/pob-data" }
pob-parser = { path = "crates/pob-parser" }
pob-build = { path = "crates/pob-build" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_cmp = "allow"

[profile.release]
debug = "line-tables-only"
